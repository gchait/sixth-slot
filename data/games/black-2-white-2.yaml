    name: Cheren
    title: Gym Leader
    party:
      - { species: patrat, level: 11, moves: [tackle, work-up, bite] }
      - { species: lillipup, level: 13, moves: [tackle, work-up, bite] }
  - id: roxie
    name: Roxie
    title: Gym Leader
    party:
      - { species: koffing, level: 16, moves: [assurance, tackle, smog] }
      - { species: whirlipede, level: 18, moves: [venoshock, protect, poison-sting, pursuit] }
  - id: burgh
    name: Burgh
    title: Gym Leader
    party:

# yaml-language-server: $schema=../game.schema.json
#
# Pokémon Black 2 and White 2, staged with Bulbapedia's walkthrough:
# https://bulbapedia.bulbagarden.net/wiki/Walkthrough:Pok%C3%A9mon_Black_2_and_White_2

name: Black 2 & White 2
versionGroup: black-2-white-2
pokedex: [updated-unova]
sprites: generation-v/black-white
starters: [snivy, tepig, oshawott]

locations:
  # Before Cheren (parts 1–2)
  aspertia-city: 0
  unova-route-19: 0
  floccesy-ranch: 0
  unova-route-20: 0
  floccesy-town: excluded # Gible or Dratini, from Benga after the Black Tower
  # Before Roxie (part 3)
  virbank-city: 1
  virbank-complex: 1
  # Before Burgh (part 4): the sewers open once Clyde is met at the Gym
  castelia-city: 2
  castelia-sewers: 2
  relic-passage/castelia-sewers-entrance: 2
  # Before Elesa (parts 5–6)
  unova-route-4: 3
  desert-resort: 3
  relic-castle: 3
  unova-route-16: 3
  lostlorn-forest: 3
  # Before Clay (part 7)
  unova-route-5: 4
  driftveil-drawbridge: 4
  driftveil-city: 4 # Zorua, from Rood
  # Before Skyla (parts 8–10)
  relic-passage: 5
  relic-castle/c: 5 # The lower floors, from Relic Passage
  relic-castle/d: 5
  unova-route-6: 5
  chargestone-cave: 5
  mistralton-cave: 5
  guidance-chamber: 5
  unova-route-7: 5
  celestial-tower: 5
  # Before Drayden (parts 11–12)
  strange-house: 6
  reversal-mountain: 6
  reversal-mountain/b1f@static: postgame # Heatran, with the Magma Stone
  undella-town: 6
  undella-bay: 6
  unova-route-13: 6
  unova-route-12: 6
  village-bridge: 6
  unova-route-11: 6
  # Before Marlon (part 13): Seaside Cave's Black Belt steps aside once Team
  # Plasma leaves Opelucid City
  unova-route-9: 7
  humilau-city: 7
  unova-route-21: 7
  unova-route-22: 7
  seaside-cave: 7
  # Before Ghetsis (part 14): the Colress Machine moves the Crustle
  seaside-cave/1f@static: 8
  giant-chasm: 8
  # Before the Elite Four (part 15): Route 23 opens after Ghetsis
  unova-route-23: 9
  unova-victory-road: 9
  unova-victory-road-2: 9
  # After the Hall of Fame (parts 16–22)
  unova-route-14: postgame
  abundant-shrine: postgame
  unova-route-15: postgame
  marvelous-bridge: postgame
  clay-tunnel: postgame
  twist-mountain: postgame
  underground-ruins: postgame
  rocky-mountain-room: postgame
  glacier-room: postgame
  iron-room: postgame
  unova-route-8: postgame
  icirrus-city: postgame
  moor-of-icirrus: postgame
  dragonspiral-tower: postgame
  pinwheel-forest: postgame
  nacrene-city: postgame
  unova-route-3: postgame
  wellspring-cave: postgame
  striaton-city: postgame
  dreamyard: postgame
  unova-route-2: postgame
  accumula-town: postgame
  unova-route-1: postgame
  unova-route-17: postgame
  unova-route-18: postgame
  p2-laboratory: postgame
  nature-sanctuary: postgame
  giant-chasm/forest-cave@static: postgame # Kyurem
  # Hidden Grottoes hold a random Pokémon, and refill only by chance
  floccesy-ranch@hidden-grotto: excluded
  lostlorn-forest@hidden-grotto: excluded
  unova-route-5@hidden-grotto: excluded
  unova-route-6@hidden-grotto: excluded
  unova-route-7@hidden-grotto: excluded
  unova-route-13@hidden-grotto: excluded
  unova-route-9@hidden-grotto: excluded
  unova-route-22@hidden-grotto: excluded
  giant-chasm@hidden-grotto: excluded
  unova-route-23@hidden-grotto: excluded

methods:
  surf: 5 # From Cheren, on Route 6
  surf-spots: 5
  super-rod: postgame # From Cedric Juniper, in Nuvema Town
  super-rod-spots: postgame
items:
  water-stone: 0 # Route 19
  fire-stone: 3 # Desert Resort
  thunder-stone: 3 # Nimbasa City
  sun-stone: 3 # Nimbasa City, from an Ace Trainer
  leaf-stone: 3 # Route 16
  moon-stone: 5 # Route 6, by the Season Research Lab
  shiny-stone: 5 # Route 6, from a girl in the rest house
  metal-coat: 5 # Chargestone Cave
  dusk-stone: 6 # Strange House
  razor-claw: 8 # Giant Chasm
  electirizer: 8 # Plasma Frigate
  magmarizer: 8
  razor-fang: 9 # Route 12, with Surf and Waterfall

hms:
  cut: 2 # From Roxie, after Team Plasma flees Virbank City
  strength: 2 # Castelia Sewers, before Burgh
  fly: 4 # From Bianca, leaving Nimbasa City
  surf: 5 # From Cheren, on Route 6
  waterfall: 9 # Victory Road
  dive: postgame # Undella Town

# Generation V needs no Badge for a move used outside battle:
# https://bulbapedia.bulbagarden.net/wiki/HM
fieldMoves:
  fly: 4
  surf: 5

encounterConditions:
  season-*: always # The season changes each month
  story-progress-quake-badge: 5 # Volcarona, in Relic Castle's lowest room
  special-encounter-couldnt-capture-before: excluded

battles:
  # Normal Mode teams, from Bulbapedia's walkthrough.

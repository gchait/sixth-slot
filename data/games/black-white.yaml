    party:
      - { species: sharpedo, level: 71, moves: [waterfall, night-slash, earthquake, aqua-jet] }
      - { species: scrafty, level: 71, moves: [crunch, poison-jab, head-smash, brick-break] }
      - { species: krookodile, level: 71, moves: [outrage, earthquake, foul-play, smack-down] }
      - { species: liepard, level: 71, moves: [sucker-punch, fake-out, aerial-ace, attract] }
      - { species: drapion, level: 71, moves: [poison-fang, fire-fang, crunch, thunder-fang] }
      - { species: bisharp, level: 73, moves: [x-scissor, night-slash, aerial-ace, guillotine] }
  - id: caitlin-rematch

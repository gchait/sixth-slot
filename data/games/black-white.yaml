      - { species: toxicroak, level: 71, moves: [earthquake, toxic, venoshock, low-sweep] }
      - { species: conkeldurr, level: 73, moves: [hammer-arm, earthquake, stone-edge, payback] }
  - id: alder
    name: Alder
    title: Champion
    postgame: true
    party:
      - { species: accelgor, level: 75, moves: [bug-buzz, focus-blast, me-first, energy-ball] }
      - { species: bouffalant, level: 75, moves: [head-charge, megahorn, stone-edge, earthquake] }
      - { species: druddigon, level: 75, moves: [night-slash, outrage, superpower, payback] }

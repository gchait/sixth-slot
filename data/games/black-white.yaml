      - { species: musharna, level: 71, moves: [reflect, hypnosis, dream-eater, psychic] }
      - { species: sigilyph, level: 71, moves: [flash-cannon, ice-beam, air-slash, psychic] }
      - { species: reuniclus, level: 71, moves: [energy-ball, thunder, focus-blast, psychic] }
      - { species: gothitelle, level: 71, moves: [flatter, payback, thunderbolt, psychic] }
      - { species: bronzong, level: 71, moves: [payback, charge-beam, flash-cannon, psychic] }
      - { species: metagross, level: 73, moves: [bullet-punch, earthquake, zen-headbutt, giga-impact] }

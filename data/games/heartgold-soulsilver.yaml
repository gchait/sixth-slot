# yaml-language-server: $schema=../game.schema.json
#
# Pokémon HeartGold and SoulSilver, staged with Bulbapedia's walkthrough:
# https://bulbapedia.bulbagarden.net/wiki/Walkthrough:Pok%C3%A9mon_HeartGold_and_SoulSilver

name: HeartGold & SoulSilver
versionGroup: heartgold-soulsilver
pokedex: [updated-johto]
sprites: generation-iv/heartgold-soulsilver
starters: [chikorita, cyndaquil, totodile]

exclusiveGroups:
  - [bulbasaur, charmander, squirtle] # Professor Oak's gift after Red

locations:
  # Before Falkner (parts 1–3)
  new-bark-town: 0
  johto-route-29: 0
  johto-route-46: 0 # Its southern part, from Route 29
  cherrygrove-city: 0
  johto-route-30: 0
  johto-route-31: 0
  dark-cave/violet-city-entrance: 0 # The cave entrance on Route 31
  violet-city: 0
  sprout-tower: 0
  ruins-of-alph: 0 # The puzzle chambers, by Route 32's fork before Elm's aide
  ruins-of-alph/outside: 4 # The grass and water west of the ruins, through Union Cave with Surf
  # Before Bugsy (parts 4–5): Route 32 continues south once Elm's aide gives the Egg
  johto-route-32: 1
  union-cave: 1
  union-cave/b2f: 4 # Across water, with Surf
  johto-route-33: 1
  azalea-town: 1
  slowpoke-well: 1
  slowpoke-well/b1f: 4 # The lower floor, with Surf and Strength
  # Before Whitney (parts 5–6): Ilex Forest's Farfetch'd, after the rival in Azalea Town
  ilex-forest: 2
  johto-route-34: 2
  goldenrod-city: 2
  johto-route-35: 2
  national-park: 2
  johto-route-36: 2 # The grass west of Sudowoodo, from Route 35
  # Before Morty (parts 7–11): Sudowoodo leaves after Whitney's SquirtBottle
  johto-route-37: 3
  ecruteak-city: 3
  goldenrod-city/bills-house: 3 # After meeting Bill in Ecruteak City
  burned-tower: 3
  roaming-johto: 3 # Raikou and Entei flee the Burned Tower
  johto-route-38: 3
  johto-route-39: 3
  olivine-city: 3
  johto-route-42: 3 # Its lakes are passed through Mt. Mortar
  mt-mortar: 3
  mt-mortar/upper-cave: 8 # With Waterfall
  mt-mortar/b1f: 8
  johto-route-43: 3
  lake-of-rage: 3
  # Before Chuck (parts 9–10): Surf works with the Fog Badge
  johto-sea-route-40: 4
  johto-sea-route-41: 4
  cianwood-city: 4

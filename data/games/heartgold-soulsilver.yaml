  kanto-route-28: 21
  mt-silver: 21
  cerulean-cave: 21
  # The orbs' story after Red (part 31), and event distributions
  embedded-tower: postgame
  sinjoh-ruins: excluded
  johto-pokemart: excluded
  # PokeAPI gives these no place in the game.
  unknown-all-bugs: excluded
  unknown-all-poliwag: excluded
  unknown-all-rattata: excluded

# Not in the game's own encounter tables, files/arc/safari_enc.json in
# https://github.com/pret/pokeheartgold, nor in Bulbapedia's Johto Safari Zone.
wrongEncounters:
  johto-safari-zone/peak@walk: [golem]
  johto-safari-zone/plains@walk: [pidgeotto]
  johto-safari-zone/mountain@walk: [pidgeotto, krabby, sealeo]

methods:
  old-rod: 1 # Route 32
  headbutt: 2 # Ilex Forest
  rock-smash: 3 # Route 36
  squirt-bottle: 3 # Goldenrod Flower Shop, after Whitney
  surf: 4 # Ecruteak City, usable with the Fog Badge
  good-rod: 4 # Olivine City
  pokeflute: 15 # The EXPN Card, from Lavender's Radio Tower after the Power Plant
  super-rod: 13 # Route 12

trades:
  steelix: { stage: 33 } # Jasmine, after her rematch
  pikachu: { stage: 36 } # Lt. Surge, after his rematch

items:
  leaf-stone: 2 # Picnicker Gina's phone calls, Route 34
  fire-stone: 3 # School Kid Alan's phone calls, Route 36
  sun-stone: 3 # First prize in the National Park's Bug-Catching Contest
  moon-stone: 4 # Ruins of Alph, with Surf
  thunder-stone: 4 # Lass Dana's phone calls, Route 38
  water-stone: 6 # Fisherman Tully, Route 42
  kings-rock: 4 # Slowpoke Well, with Surf and Strength
  dragon-scale: 8 # Mt. Mortar 2F, with Waterfall
  metal-coat: 13 # S.S. Aqua
  up-grade: 13 # Silph Co.

hms:
  cut: 2 # Ilex Forest
  rock-smash: 3 # Route 36
  surf: 3 # Ecruteak Dance Theater
  fly: 5 # Cianwood City, after Chuck
  strength: 3 # Route 42, from a Hiker at Mt. Mortar
  whirlpool: 6 # Team Rocket HQ
  waterfall: 7 # Ice Path
  rock-climb: 21 # Professor Oak, once all 16 Badges are earned

# Badges from the walkthrough
fieldMoves:
  surf: 4 # Fog Badge
  fly: 5 # Storm Badge

# https://bulbapedia.bulbagarden.net/wiki/Heart_Scale
# No moveRelearner: the Move Reminder in Blackthorn City takes a Heart Scale,
# and the story leaves two in the field; the rest come from one breakable rock
# in twenty.

encounterConditions:
  time-*: 0 # Any time of day
  weekday-*: 0 # Lapras in Union Cave on Fridays, and the Bug-Catching Contest
  swarm-no: 0
  swarm-yes: excluded # A different swarm each day
  radio-off: 0
  radio-hoenn: 13 # The Hoenn and Sinnoh Sound, with the National Pokédex
  radio-sinnoh: 13
  # Every Trainer ID gets trees of both groups in each place
  headbutt-tree-common: 0
  headbutt-tree-rare: 0
  headbutt-tree-secret: 21 # A third group of trees, most behind rocky walls for Rock Climb
  bug-catching-contest-*: 0
  johto-safari-blocks-inactive: 0
  johto-safari-blocks-*: excluded # Objects unlocked over gameplay hours and days
  coins-*: excluded # Coins come only from Voltorb Flip outside Japan
  item-*: excluded # Fossils are rare finds in breakable rocks
  story-progress-before-national-dex: 0
  story-progress-zephyr-badge: 1 # The Mystery Egg, from Elm's aide after Falkner
  story-progress-awakened-beasts: 3
  story-progress-national-dex: 13 # Olivine City, after the Hall of Fame
  story-progress-returned-machine-part: 15
  story-progress-vermilion-copycat: 15 # Latias or Latios roam once Steven appears
  story-progress-receive-tm-from-claire: 8
  story-progress-beat-red: 22
  other-received-kanto-starter: 22 # From Professor Oak, after Red
  other-snorlax-11-beat-league: excluded # Snorlax again, after another Pokémon League win
  other-correct-password: excluded # An Egg for a password from outside the game
  other-event-arceus-in-party: excluded


  # Before Jasmine (part 10): Cliff Edge Gate opens once Amphy is healed
  johto-route-47: 5
  johto-route-47@walk: 8 # Tall grass behind a waterfall
  johto-route-47/inside-cave@walk: 5 # Cliff Cave, on the way to Route 48
  johto-route-47/cave-gate: 21 # A pond in Cliff Edge Gate, with Rock Climb
  johto-route-48: 5
  safari-zone-gate: 5
  # The first visit opens one of ten layouts of six areas, each with the Peak at
  # the entrance. The Area Customizer, for the other areas, comes with Baoba's
  # call three hours of play later (part 31); this assumes the Elite Four.
  johto-safari-zone/peak: 5
  johto-safari-zone: 8
  # Before Pryce (part 11)
  team-rocket-hq: 6
  # Before Clair (parts 12–13): the Mahogany salesman leaves after the Radio Tower
  johto-route-44: 7
  ice-path: 7
  whirl-islands: 7 # With Whirlpool
